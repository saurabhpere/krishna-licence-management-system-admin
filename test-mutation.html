<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mutation - Debug React App Issue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Test Mutation - Debug React App Issue</h1>
        
        <div class="space-y-6">
            <!-- Test API Client -->
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4">Test API Client (Same as React App)</h2>
                <button onclick="testApiClient()" class="btn btn-primary btn-md">Test API Client</button>
                <div id="apiClientResult" class="mt-4 p-4 bg-gray-100 rounded hidden">
                    <pre id="apiClientOutput" class="text-sm"></pre>
                </div>
            </div>

            <!-- Test Form Data -->
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4">Test Form Data (Same as React App)</h2>
                <form onsubmit="testFormData(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                        <input type="text" id="formName" value="Test Pack React" class="input w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <input type="text" id="formDescription" value="Test Description React" class="input w-full">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">SKU</label>
                        <input type="text" id="formSku" value="test-pack-react-debug" class="input w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Price</label>
                        <input type="number" id="formPrice" value="29.99" step="0.01" class="input w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Validity (months)</label>
                        <input type="number" id="formValidity" value="6" min="1" max="12" class="input w-full" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-md">Test Form Data</button>
                </form>
                <div id="formDataResult" class="mt-4 p-4 bg-gray-100 rounded hidden">
                    <pre id="formDataOutput" class="text-sm"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;

        // Create API client similar to React app
        const apiClient = axios.create({
            baseURL: 'http://localhost:8080',
            headers: {
                'Content-Type': 'application/json',
            },
        });

        // Add request interceptor
        apiClient.interceptors.request.use(
            (config) => {
                if (authToken) {
                    config.headers.Authorization = `Bearer ${authToken}`;
                }
                return config;
            },
            (error) => {
                return Promise.reject(error);
            }
        );

        // Add response interceptor
        apiClient.interceptors.response.use(
            (response) => response,
            (error) => {
                if (error.response?.status === 401) {
                    localStorage.removeItem('admin_token');
                    window.location.href = '/login';
                }
                return Promise.reject(error);
            }
        );

        function showResult(elementId, outputId, data) {
            document.getElementById(elementId).classList.remove('hidden');
            document.getElementById(outputId).textContent = JSON.stringify(data, null, 2);
        }

        async function testApiClient() {
            try {
                // First login
                const loginResponse = await apiClient.post('/api/admin/login', {
                    email: 'admin@example.com',
                    password: 'admin123'
                });
                
                if (loginResponse.data.success && loginResponse.data.data && loginResponse.data.data.token) {
                    authToken = loginResponse.data.data.token;
                    localStorage.setItem('admin_token', authToken);
                    
                    showResult('apiClientResult', 'apiClientOutput', { 
                        success: true, 
                        message: 'API Client setup successful!',
                        token: authToken.substring(0, 20) + '...'
                    });
                } else {
                    showResult('apiClientResult', 'apiClientOutput', loginResponse.data);
                }
            } catch (error) {
                showResult('apiClientResult', 'apiClientOutput', { 
                    success: false, 
                    error: error.message,
                    response: error.response?.data
                });
            }
        }

        async function testFormData(event) {
            event.preventDefault();
            
            if (!authToken) {
                alert('Please setup API client first!');
                return;
            }
            
            try {
                const formData = {
                    name: document.getElementById('formName').value,
                    description: document.getElementById('formDescription').value,
                    sku: document.getElementById('formSku').value,
                    price: parseFloat(document.getElementById('formPrice').value),
                    validity_months: parseInt(document.getElementById('formValidity').value)
                };
                
                console.log('Sending form data:', formData);
                
                const response = await apiClient.post('/api/v1/packs', formData);
                
                console.log('Response:', response);
                
                showResult('formDataResult', 'formDataOutput', { 
                    success: true, 
                    status: response.status,
                    data: response.data 
                });
            } catch (error) {
                console.error('Error:', error);
                showResult('formDataResult', 'formDataOutput', { 
                    success: false, 
                    error: error.message,
                    response: error.response?.data,
                    status: error.response?.status
                });
            }
        }
    </script>
</body>
</html>
